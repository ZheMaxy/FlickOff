name: Build and test

on:
  push:
    # Push to a ci-check/ branch to try a change, workflows included, before it reaches main.
    branches: [main, 'ci-check/**']
    paths-ignore:
      - '**/*.md'
      - appcast.xml
  pull_request:
    paths-ignore:
      - '**/*.md'
      - appcast.xml
  schedule:
    # A new runner image can change the private APIs the app depends on, with no commit to trigger a run.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older one, but must not cancel a scheduled or manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Hosted runners have no Touch Bar, so hardware tests stay off; see scripts/preflight.py for those.
  macos:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
      - name: Tests, private API contract, bundle and read-only smoke checks
        env:
          TB_API_TESTS: '1'
        run: ./build.sh
      - name: Build and validate the native installer without installing
        run: |
          python3 scripts/make_installer.py --output build/installer-ci
          python3 Tests/Integration/installer_test.py --pkg build/installer-ci/*.pkg --dmg build/installer-ci/*.dmg
      - name: Check integration-test sources and release guards without hardware writes
        run: |
          python3 -m py_compile Tests/Integration/*.py scripts/*.py
          python3 Tests/Integration/release_checks_test.py
          xcrun clang -fsyntax-only -fobjc-arc -I Sources/TBPrivate/include Tests/Integration/PanelProbe.m
          xcrun clang -fsyntax-only -fobjc-arc -F build/FlickOff.app/Contents/Frameworks Tests/Integration/UpdateProbe.m

  # The newest runner image, and the same again weekly so an API change shows up without a commit.
  newer-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Tests and the private API contract
        env:
          TB_API_TESTS: '1'
        run: ./build.sh test
