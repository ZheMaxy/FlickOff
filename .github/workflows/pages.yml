name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the images
        run: cp docs/images/menu.png docs/images/icon.png docs/images/favicon.png docs/images/social-preview.png site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Tell search engines that take IndexNow
        run: |
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host": "zhemaxy.github.io", "key": "9b6bb7e7a151340b7fecd2b6cd58bd8f",
                 "keyLocation": "https://zhemaxy.github.io/FlickOff/9b6bb7e7a151340b7fecd2b6cd58bd8f.txt",
                 "urlList": ["https://zhemaxy.github.io/FlickOff/",
                             "https://zhemaxy.github.io/FlickOff/touch-bar-flickering/",
                             "https://zhemaxy.github.io/FlickOff/turn-off-touch-bar/"]}' || true
